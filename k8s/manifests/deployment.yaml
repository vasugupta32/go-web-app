# Kubernetes Deployment manifest for the Go web application
# This resource defines how the application pods are created and managed

apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web-app
  labels:
    app: go-web-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-web-app

  template:
    metadata:
      labels:
        app: go-web-app

    spec:
      containers:
        - name: go-web-app
          image: vasugupta32/go-web-app:v3
          ports:
            - containerPort: 8080
